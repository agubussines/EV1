<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - VetApp</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #224161; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            text-align: center; 
            color: #2c3e50; 
        }
        .error-container { 
            background: white; 
            padding: 4rem 3rem; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            max-width: 550px; 
            width: 90%;
        }
        h1 { 
            font-size: 7rem; 
            margin: 0; 
            color: #e74c3c; 
            line-height: 1;
        }
        h2 { 
            font-size: 2.2rem; 
            margin-top: 10px; 
            margin-bottom: 20px;
        }
        p { 
            color: #7f8c8d; 
            font-size: 1.1rem; 
            margin-bottom: 2.5rem; 
            line-height: 1.6;
        }
        .btn { 
            background-color: #3498db; 
            color: white; 
            padding: 14px 35px; 
            text-decoration: none; 
            border-radius: 30px; 
            font-weight: bold; 
            font-size: 1.1rem;
            transition: background 0.3s; 
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.3);
        }
        .btn:hover { 
            background-color: #2980b9; 
        }
    </style>
</head>
<body>

    <div class="error-container">
        <h1>404</h1>
        <h2>¡Guau! Nos perdimos</h2>
        <p>Parece que el rastro se ha borrado. La página que estás buscando no existe, fue movida o el enlace es incorrecto.</p>
        <a href="/" class="btn">Volver a la página principal</a>
    </div>

</body>
</html>
